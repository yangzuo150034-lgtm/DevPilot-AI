name: DevPilot CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devpilot
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: devpilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devpilot"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install --no-deps -e backend
      - run: docker pull python:3.12-slim
      - run: python -m pytest backend/tests/test_docker_live.py backend/tests/test_infrastructure.py -q
        env:
          DEVPILOT_TEST_DOCKER: '1'
          DEVPILOT_TEST_INFRASTRUCTURE: '1'
      - run: docker compose config --quiet
        env:
          DEVPILOT_POSTGRES_PASSWORD: ci_only_password
          DEVPILOT_API_TOKEN: ci_only_workspace_token
      - run: docker compose up -d --build
        env:
          DEVPILOT_POSTGRES_PASSWORD: ci_only_password
          DEVPILOT_API_TOKEN: ci_only_workspace_token
      - run: python scripts/smoke_http.py
        env:
          DEVPILOT_API_TOKEN: ci_only_workspace_token
      - if: always()
        run: docker compose logs --tail 80 backend worker
        env:
          DEVPILOT_POSTGRES_PASSWORD: ci_only_password
          DEVPILOT_API_TOKEN: ci_only_workspace_token

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v7
        with: { node-version: '22.22.0' }
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements.lock
      - run: .venv/bin/python -m pip install --no-deps -e backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
