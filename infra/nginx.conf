server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host backend;
        proxy_read_timeout 180s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
